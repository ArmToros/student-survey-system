services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in your local .env file}"
    ports:
      - "1434:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
      # RESTORE FROM DISK reads the backup server-side, so the folder has to be
      # mounted here as well as in db-restore. It may be empty: without SSS.bak the
      # database is seeded with synthetic data instead.
      - "./new database:/var/opt/mssql/backup:ro"

  # Prepares the SSS database, then exits. It restores "new database/SSS.bak" when
  # that file is there and seeds scripts/seed-dev-data.sql when it is not, so the
  # stack comes up either way; set SSS_DB_INIT to restore or seed to choose
  # explicitly. The service keeps the name db-restore because scripts/restore.sh
  # and the README refer to it.
  db-restore:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      - db
    environment:
      SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in your local .env file}"
      SSS_DB_INIT: "${SSS_DB_INIT:-auto}"
    volumes:
      - ./scripts:/app/scripts:ro
      # Read-only, and only so the script can see whether the backup exists.
      - "./new database:/var/opt/mssql/backup:ro"
    command: /bin/bash /app/scripts/db-init.sh
    restart: "no"

  backend:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    working_dir: /app/backend
    volumes:
      - .:/app
    ports:
      - "5001:5001"
    command: dotnet watch run --urls "http://0.0.0.0:5001"
    depends_on:
      db-restore:
        condition: service_completed_successfully
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=SSS;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in your local .env file};TrustServerCertificate=True;
      - JWT_SIGNING_KEY=${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in your local .env file}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OpenAI__Model=${OPENAI_MODEL:-gpt-4o-mini}

volumes:
  sqlserver-data:
